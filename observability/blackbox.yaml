apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: platform-lab
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.27.0
          args: ["--config.file=/etc/blackbox_exporter/config.yml"]
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox_exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: platform-lab
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: ip4
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: platform-lab
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: platform-demo
  namespace: platform-lab
  labels:
    app.kubernetes.io/part-of: platform-demo
spec:
  jobName: platform-demo
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.platform-lab.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://platform-demo.platform-lab.svc.cluster.local
