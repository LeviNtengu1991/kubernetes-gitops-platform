apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LeviNtengu1991/kubernetes-gitops-platform.git
    targetRevision: main
    path: charts/platform-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
