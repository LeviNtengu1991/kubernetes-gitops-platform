replicaCount: 2

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27.1-alpine"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

service:
  port: 80

slo:
  availabilityTarget: 99.5
